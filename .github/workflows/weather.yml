name: 两地天气推送
on:
  schedule:
    - cron: '30 22 * * *'
    - cron: '0 11 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: '运行模式'
        required: true
        default: 'realtime'
        type: choice
        options:
          - realtime
          - midnight
jobs:
  weather:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run
        env:
          SENDKEY: ${{ secrets.SENDKEY }}
          QWKEY: ${{ secrets.QWKEY }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE="${{ github.event.inputs.mode }}"
          elif [ "${{ github.event.schedule }}" = "0 11 * * *" ]; then
            MODE="midnight"
          else
            MODE="realtime"
          fi
          echo "MODE=$MODE"
          python weather.py "$MODE"
